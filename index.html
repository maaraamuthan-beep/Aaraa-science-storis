<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aaraa Science Stories</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif}
#stage{position:relative;width:100%;height:100%;overflow:hidden;background:#2a1d3a}
#wall{position:absolute;inset:0 0 30% 0;background:linear-gradient(#6a5a8a,#8a76a8 70%,#9d8ab8)}
#floor{position:absolute;left:0;right:0;bottom:0;height:30%;background:linear-gradient(#9a6a3e,#6a4222);box-shadow:inset 0 14px 22px rgba(0,0,0,.4)}
#floor:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(0,0,0,.14) 0 2px,transparent 2px 90px)}
#rug{position:absolute;left:10%;bottom:6%;width:50%;height:14%;background:radial-gradient(ellipse,#d95d5d,#a83a3a);border-radius:50%;opacity:.85}
#winwrap{position:absolute;left:5%;top:10%;width:22%;height:44%}
#win{position:absolute;inset:0;border:10px solid #f2e6d0;background:linear-gradient(#ffe7b0,#ffc678 55%,#ffa95e);box-shadow:inset 0 0 50px rgba(255,245,200,.9),0 0 40px rgba(255,210,130,.6)}
#win:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:8px;margin-left:-4px;background:#f2e6d0}
#win:after{content:"";position:absolute;top:50%;left:0;right:0;height:8px;margin-top:-4px;background:#f2e6d0}
#wsun{position:absolute;right:16%;top:22%;width:50px;height:50px;border-radius:50%;background:radial-gradient(circle,#fff,#ffe9a0 55%,#ffb347);box-shadow:0 0 26px 12px rgba(255,225,130,.9)}
#curL,#curR{position:absolute;top:-8px;width:18%;height:calc(100% + 22px);background:linear-gradient(90deg,#b73a2c,#e5584a,#a02f24)}
#curL{left:-24%;border-radius:0 0 36px 8px}#curR{right:-24%;border-radius:0 0 8px 36px}
#sill{position:absolute;left:-6%;right:-6%;bottom:-16px;height:12px;background:#e6d7bd;box-shadow:0 5px 8px rgba(0,0,0,.4)}
#night{position:absolute;inset:0;background:rgba(15,10,50,.5);transition:opacity 2.5s;pointer-events:none;z-index:6}
#stage.beam #night{opacity:.1}
#shaft{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 2s;z-index:5;mix-blend-mode:screen}
#stage.beam #shaft{opacity:1}
#shaft svg{width:100%;height:100%}
#bedwrap{position:absolute;left:34%;bottom:14%;width:58%;height:40%}
#bedhead{position:absolute;left:-2%;bottom:0;width:6%;height:100%;background:linear-gradient(90deg,#5a3418,#8a5a2f);border-radius:10px 10px 4px 4px}
#bedbase{position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(#8a5a2f,#53301a);border-radius:6px;box-shadow:0 10px 16px rgba(0,0,0,.5)}
#mattress{position:absolute;left:3%;right:1%;bottom:30%;height:18%;background:linear-gradient(#f6f1e8,#d9d0bf);border-radius:12px}
#pillow{position:absolute;left:5%;bottom:42%;width:24%;height:18%;background:radial-gradient(ellipse at 40% 30%,#fff,#e2d9c8);border-radius:50%;box-shadow:0 5px 8px rgba(0,0,0,.3)}
#sleeper{position:absolute;left:6%;bottom:44%;width:80%;height:46%;transition:opacity .4s}
#sleeper svg{width:100%;height:100%}
#stage.awake #sleeper{opacity:0}
#blanketAll{position:absolute;left:24%;right:2%;bottom:40%;height:20%;background:linear-gradient(135deg,#4a90d9,#235a96);border-radius:16px 16px 6px 6px;box-shadow:0 6px 10px rgba(0,0,0,.4);transition:transform .8s ease,opacity .8s;z-index:3}
#blanketAll:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(60deg,rgba(255,255,255,.1) 0 10px,transparent 10px 26px);border-radius:inherit}
#stage.cover #blanketAll{transform:translate(-62%,-60%) rotate(-12deg)}
#stage.out #blanketAll{transform:translate(8%,10%) scale(.9);}
#zzz{position:absolute;left:44%;bottom:54%;color:#fff;font-weight:bold;font-size:24px;animation:zz 2.4s ease-in-out infinite;z-index:4}
@keyframes zz{0%{transform:translate(0,10px);opacity:0}30%{opacity:.9}100%{transform:translate(14px,-36px);opacity:0}}
#stage.cover #zzz,#stage.awake #zzz{display:none}
#boy{position:absolute;left:40%;bottom:16%;width:18%;height:48%;opacity:0;transition:left 1.4s ease,opacity .3s;z-index:4}
#stage.awake #boy{opacity:1}
#boy svg{width:100%;height:100%;overflow:visible}
.mouth{transform-origin:60px 78px}
.talk .mouth{animation:talk .2s steps(2) infinite}
@keyframes talk{50%{transform:scaleY(.25)}}
.talk .armL{animation:wave .4s ease-in-out infinite alternate}
.armL{transform-origin:30px 108px}
@keyframes wave{to{transform:rotate(-55deg)}}
.talk .armR{animation:wave2 .5s ease-in-out infinite alternate}
.armR{transform-origin:90px 108px}
@keyframes wave2{to{transform:rotate(50deg)}}
#stage.shout #boy{left:56%}
#boy .hands{opacity:0}
#stage.cover #boy .hands{opacity:1}
#dog{position:absolute;left:-34%;bottom:9%;width:25%;height:24%;transition:left 2.2s ease-in-out;filter:drop-shadow(8px 6px 6px rgba(0,0,0,.5));z-index:4}
#dog svg{width:100%;height:100%}
.tail{transform-origin:22px 50px;animation:wag .28s ease-in-out infinite alternate}
@keyframes wag{to{transform:rotate(38deg)}}
.dbounce{animation:hop .5s ease-in-out infinite}
@keyframes hop{50%{transform:translateY(-12px)}}
.blink{animation:blink 4s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
#start{position:absolute;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,15,45,.9);color:#fff;font-size:26px;cursor:pointer;text-align:center}
#start b{display:block;font-size:34px;margin-bottom:10px}
#go{margin-top:22px;background:linear-gradient(#ffb300,#ff7a00);border-radius:60px;padding:16px 46px;font-size:26px;box-shadow:0 6px 16px rgba(0,0,0,.5)}
#next{display:none;position:absolute;bottom:5%;right:4%;z-index:8;background:linear-gradient(#ffb300,#ff7a00);color:#fff;font-size:24px;padding:14px 38px;border-radius:60px;text-decoration:none;box-shadow:0 6px 16px rgba(0,0,0,.5)}
</style>
</head>
<body>

        <circle cx="34" cy="46" r="30" fill="url(#skin)"/>
        <path d="M6 40 Q10 10 36 12 Q58 14 62 40 Q50 24 34 24 Q18 26 6 40Z" fill="#1d120a"/>
        <path d="M18 52 Q26 58 34 52" stroke="#1d120a" stroke-width="3" fill="none"/><path d="M40 52 Q48 58 56 52" stroke="#1d120a" stroke-width="3" fill="none"/>
        <path d="M16 42 Q24 37 32 42" stroke="#1d120a" stroke-width="2.5" fill="none"/><path d="M40 42 Q48 37 56 42" stroke="#1d120a" stroke-width="2.5" fill="none"/>
        <path d="M28 66 Q38 72 48 66" stroke="#7a1f1f" stroke-width="3" fill="none"/>
        <circle cx="14" cy="60" r="5" fill="rgba(255,120,100,.35)"/>
      </svg>
    </div>
  </div>
  <div id="blanketAll"></div>
  <div id="zzz">Z z z</div>

  <div id="boy">
    <svg viewBox="0 0 120 230">
      <defs>
        <radialGradient id="skin2" cx=".4" cy=".35"><stop offset="0" stop-color="#f0b06a"/><stop offset="1" stop-color="#c2783a"/></radialGradient>
        <linearGradient id="pj2" x1="0" x2="1"><stop offset="0" stop-color="#7cc8ff"/><stop offset="1" stop-color="#2f84d6"/></linearGradient>
      </defs>
      <ellipse cx="60" cy="224" rx="40" ry="6" fill="rgba(0,0,0,.3)"/>
      <rect x="36" y="148" width="20" height="64" rx="8" fill="url(#pj2)"/><rect x="64" y="148" width="20" height="64" rx="8" fill="url(#pj2)"/>
      <ellipse cx="42" cy="216" rx="16" ry="7" fill="#3e2723"/><ellipse cx="78" cy="216" rx="16" ry="7" fill="#3e2723"/>
      <rect x="32" y="98" width="56" height="68" rx="16" fill="url(#pj2)"/>
      <g class="armL"><rect x="14" y="104" width="16" height="52" rx="8" fill="url(#pj2)"/><circle cx="22" cy="158" r="9" fill="url(#skin2)"/></g>
      <g class="armR"><rect x="90" y="104" width="16" height="52" rx="8" fill="url(#pj2)"/><circle cx="98" cy="158" r="9" fill="url(#skin2)"/></g>
      <rect x="52" y="86" width="16" height="16" fill="#c2783a"/>
      <ellipse cx="60" cy="56" rx="40" ry="42" fill="url(#skin2)"/>
      <ellipse cx="22" cy="60" rx="7" ry="10" fill="#c2783a"/><ellipse cx="98" cy="60" rx="7" ry="10" fill="#c2783a"/>
      <path d="M19 52 Q20 4 60 6 Q100 4 101 52 Q94 26 78 22 Q64 36 44 26 Q26 32 19 52Z" fill="#1d120a"/>
      <g class="blink" style="transform-origin:60px 58px">
        <ellipse cx="44" cy="58" rx="9" ry="10" fill="#fff"/><ellipse cx="76" cy="58" rx="9" ry="10" fill="#fff"/>
        <circle cx="46" cy="59" r="5" fill="#3b2314"/><circle cx="78" cy="59" r="5" fill="#3b2314"/>

      </g>
      <path d="M32 42 Q44 34 56 43" stroke="#1d120a" stroke-width="3.2" fill="none"/><path d="M64 43 Q76 34 88 42" stroke="#1d120a" stroke-width="3.2" fill="none"/>
      <path d="M58 64 Q60 72 63 68" stroke="#a85f2a" stroke-width="2.5" fill="none"/>
      <circle cx="34" cy="76" r="6" fill="rgba(255,120,100,.35)"/><circle cx="86" cy="76" r="6" fill="rgba(255,120,100,.35)"/>
      <g class="mouth"><path d="M44 80 Q60 102 76 80Z" fill="#7a1f1f"/><path d="M49 81 Q60 87 71 81 L71 83 Q60 90 49 83Z" fill="#fff"/></g>
      <g class="hands"><ellipse cx="44" cy="56" rx="20" ry="14" fill="url(#skin2)" transform="rotate(-10 44 56)"/><ellipse cx="78" cy="56" rx="20" ry="14" fill="url(#skin2)" transform="rotate(10 78 56)"/></g>
    </svg>
  </div>

  <div id="shaft">
    <svg viewBox="0 0 100 100" preserveAspectRatio="none">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff8cc" stop-opacity=".9"/><stop offset="1" stop-color="#ffd77a" stop-opacity=".2"/></linearGradient><filter id="bl"><feGaussianBlur stdDeviation="1.2"/></filter></defs>
      <polygon points="7,12 27,12 56,50 40,64" fill="url(#lg)" filter="url(#bl)"/>

  <div id="dog">
    <svg viewBox="0 0 160 120">
      <defs><radialGradient id="fur" cx=".4" cy=".3"><stop offset="0" stop-color="#f0aa66"/><stop offset="1" stop-color="#b8662c"/></radialGradient></defs>
      <ellipse cx="72" cy="114" rx="60" ry="6" fill="rgba(0,0,0,.3)"/>
      <g class="tail"><path d="M22 50 Q0 24 10 8" stroke="#b8662c" stroke-width="11" fill="none" stroke-linecap="round"/></g>
      <ellipse cx="70" cy="66" rx="50" ry="30" fill="url(#fur)"/>
      <ellipse cx="72" cy="80" rx="30" ry="16" fill="#f6d3a8"/>

      <rect x="84" y="86" width="14" height="26" rx="7" fill="#b8662c"/><rect x="98" y="82" width="14" height="30" rx="7" fill="#a85a24"/>

      <g class="blink" style="transform-origin:118px 40px">
        <circle cx="110" cy="40" r="6" fill="#fff"/><circle cx="111.5" cy="40.5" r="3.3" fill="#2a170a"/><circle cx="112.5" cy="39" r="1.1" fill="#fff"/>
        <circle cx="128" cy="40" r="6" fill="#fff"/><circle cx="129.5" cy="40.5" r="3.3" fill="#2a170a"/><circle cx="130.5" cy="39" r="1.1" fill="#fff"/>
      </g>

      <g class="mouth" style="transform-origin:132px 66px"><path d="M124 64 Q134 78 144 64Z" fill="#c2185b"/><ellipse cx="134" cy="71" rx="5" ry="3" fill="#ff8a9b"/></g>
    </svg>

  <div id="night"></div>
  <a id="next" href="page2.html">Next ➜</a>
  <div id="start"><b>Aaraa Science Stories</b>ஒளி (Light)<div id="go">▶ Start</div></div>
</div>

<audio id="r1" src="r1.mp3" preload="auto"></audio><audio id="d1" src="d1.mp3" preload="auto"></audio>
<audio id="r2" src="r2.mp3" preload="auto"></audio><audio id="d2" src="d2.mp3" preload="auto"></audio>
<audio id="r3" src="r3.mp3" preload="auto"></audio><audio id="d3" src="d3.mp3" preload="auto"></audio>
<audio id="r4" src="r4.mp3" preload="auto"></audio><audio id="d4" src="d4.mp3" preload="auto"></audio>
<audio id="r5" src="r5.mp3" preload="auto"></audio>

<script>
var stage=document.getElementById("stage"),boy=document.getElementById("boy"),dogBox=document.getElementById("dog");
function wait(ms){return new Promise(function(r){setTimeout(r,ms)})}
function play(id,who){
  return new Promise(function(done){
    var a=document.getElementById(id);
    who.classList.add("talk");
    function finish(){who.classList.remove("talk");done()}
    a.currentTime=0;a.onended=finish;a.onerror=function(){setTimeout(finish,2000)};
    var p=a.play();if(p&&p.catch){p.catch(function(){setTimeout(finish,2000)})}
  });
}
async function story(){
  await wait(2500);
  stage.classList.add("beam");
  await wait(2800);
  stage.classList.add("cover");
  await wait(1800);
  stage.classList.add("awake");
  stage.classList.remove("cover");
  stage.classList.add("out");
  await wait(900);
  stage.classList.add("shout");
  await wait(1200);
  await play("r1",boy);
  dogBox.style.left="10%";
  await wait(2400);
  dogBox.classList.add("dbounce");
  await play("d1",dogBox);
  await play("r2",boy);
  await play("d2",dogBox);
  await play("r3",boy);
  await play("d3",dogBox);
  await play("r4",boy);
  await play("d4",dogBox);
  await play("r5",boy);
  dogBox.classList.remove("dbounce");
  document.getElementById("next").style.display="block";
}
document.getElementById("start").onclick=function(){this.style.display="none";story()};
</script>
</body>
</html>
