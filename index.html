<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aaraa Science Stories</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif}
#stage{position:relative;width:100%;height:100%;overflow:hidden;background:linear-gradient(#4aa8ff 0%,#9fd8ff 55%,#cfeeff 70%)}
#sun{position:absolute;top:6%;right:8%;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,#fffbe0 0%,#ffe066 45%,#ffb300 100%);box-shadow:0 0 60px 30px rgba(255,214,0,.7);animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.1);box-shadow:0 0 90px 45px rgba(255,214,0,.8)}}
.ray{position:absolute;top:calc(6% + 55px);right:calc(8% + 55px);height:5px;width:0;background:linear-gradient(90deg,rgba(255,240,150,.95),rgba(255,240,150,0));transform-origin:right center;border-radius:5px}
#stage.play .ray{animation:shoot 2.5s ease-out forwards}
.r1{transform:rotate(168deg)}.r2{transform:rotate(180deg);animation-delay:.3s!important}.r3{transform:rotate(192deg);animation-delay:.6s!important}
@keyframes shoot{to{width:70%}}
.cloud{position:absolute;background:#fff;border-radius:50px;opacity:.9;animation:drift linear infinite}
.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}
.c1{top:10%;left:-20%;width:120px;height:40px;animation-duration:40s}
.c1:before{width:50px;height:50px;top:-25px;left:15px}.c1:after{width:60px;height:60px;top:-30px;left:55px}
.c2{top:22%;left:-30%;width:90px;height:30px;animation-duration:55s;animation-delay:-20s}
.c2:before{width:40px;height:40px;top:-20px;left:10px}.c2:after{width:45px;height:45px;top:-22px;left:40px}
@keyframes drift{to{transform:translateX(150vw)}}
#hills{position:absolute;bottom:22%;left:0;width:100%;height:20%;background:radial-gradient(ellipse at 30% 100%,#5fbf5f 60%,transparent 61%),radial-gradient(ellipse at 75% 100%,#4aa84a 60%,transparent 61%)}
#ground{position:absolute;bottom:0;left:0;width:100%;height:24%;background:linear-gradient(#6cd36c,#3a9a3a)}
#house{position:absolute;bottom:20%;left:6%;width:150px;height:120px;background:#ffcc80;border:3px solid #c68a3c}
#house:before{content:"";position:absolute;top:-55px;left:-18px;border-left:93px solid transparent;border-right:93px solid transparent;border-bottom:55px solid #d84315}
#house .win{position:absolute;top:30px;left:50px;width:50px;height:45px;background:#cfeeff;border:4px solid #8d5524;box-shadow:inset 0 0 12px #fff}
.char{position:absolute;bottom:14%;transition:left 1.6s ease-in-out,transform .3s}
#ravi{left:30%;width:110px;height:200px}
#dog{left:-30%;width:150px;height:110px}
.bounce{animation:hop .5s ease-in-out infinite}
@keyframes hop{50%{transform:translateY(-14px)}}
.talk .mouth{animation:talk .25s steps(2) infinite}
@keyframes talk{50%{transform:scaleY(.3)}}
.tail{transform-origin:20px 40px;animation:wag .3s ease-in-out infinite alternate}
@keyframes wag{to{transform:rotate(35deg)}}
#mirror{position:absolute;bottom:25%;right:12%;width:80px;height:130px;border:6px solid #8d5524;border-radius:12px;background:linear-gradient(135deg,#e8f6ff,#9fd0ee 50%,#e8f6ff);opacity:0;transition:opacity 1s}
#stage.showMirror #mirror{opacity:1}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#start{position:absolute;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,40,90,.82);color:#fff;font-size:26px;cursor:pointer;text-align:center}
#start b{display:block;font-size:34px;margin-bottom:18px}
#go{margin-top:20px;background:#ff9800;border-radius:60px;padding:16px 42px;font-size:26px;box-shadow:0 6px 16px rgba(0,0,0,.4)}
#sub{position:absolute;bottom:3%;left:0;width:100%;text-align:center;color:#fff;font-size:18px;text-shadow:0 2px 5px #000;opacity:.0;padding:0 10px}
</style>
</head>
<body>
<div id="stage">
  <div id="sun"></div>
  <div class="ray r1"></div><div class="ray r2"></div><div class="ray r3"></div>
  <div class="cloud c1"></div><div class="cloud c2"></div>
  <div id="hills"></div>
  <div id="house"><div class="win"></div></div>
  <div id="ground"></div>
  <div id="mirror"></div>

  <svg id="ravi" class="char" viewBox="0 0 110 200">
    <rect x="30" y="95" width="50" height="60" rx="10" fill="#ef5350"/>
    <rect x="32" y="150" width="18" height="45" fill="#3f51b5"/><rect x="58" y="150" width="18" height="45" fill="#3f51b5"/>
    <rect x="18" y="100" width="14" height="45" rx="7" fill="#c68642"/><rect x="78" y="100" width="14" height="45" rx="7" fill="#c68642"/>
    <circle cx="55" cy="58" r="38" fill="#c68642"/>
    <path d="M17 52 Q55 -8 93 52 Q80 25 55 28 Q30 25 17 52Z" fill="#2b1b10"/>
    <circle cx="42" cy="58" r="7" fill="#fff"/><circle cx="68" cy="58" r="7" fill="#fff"/>
    <circle cx="43" cy="59" r="3.5" fill="#222"/><circle cx="69" cy="59" r="3.5" fill="#222"/>
    <g class="mouth" style="transform-origin:55px 78px"><ellipse cx="55" cy="78" rx="10" ry="7" fill="#7a1f1f"/></g>
  </svg>

  <svg id="dog" class="char" viewBox="0 0 150 110">
    <g class="tail"><path d="M20 45 Q0 20 10 8" stroke="#a0522d" stroke-width="10" fill="none" stroke-linecap="round"/></g>
    <ellipse cx="65" cy="60" rx="45" ry="28" fill="#d2884a"/>
    <rect x="30" y="75" width="12" height="30" rx="6" fill="#b5713a"/><rect x="80" y="75" width="12" height="30" rx="6" fill="#b5713a"/>
    <circle cx="112" cy="42" r="26" fill="#d2884a"/>
    <ellipse cx="95" cy="30" rx="10" ry="20" fill="#8b4d1f"/>
    <ellipse cx="128" cy="52" rx="14" ry="10" fill="#f1c8a0"/><circle cx="137" cy="48" r="5" fill="#222"/>
    <circle cx="112" cy="36" r="5" fill="#fff"/><circle cx="113" cy="36" r="2.5" fill="#222"/>
    <g class="mouth" style="transform-origin:126px 60px"><path d="M118 58 Q127 68 136 58Z" fill="#c2185b"/></g>
  </svg>

  <div id="flash"></div>
  <div id="sub"></div>

  <div id="start"><b>Aaraa Science Stories</b>ஒளி (Light)<div id="go">▶ Start</div></div>
</div>

<script>
var stage=document.getElementById("stage"),ravi=document.getElementById("ravi"),dog=document.getElementById("dog"),sub=document.getElementById("sub");

function wait(ms){return new Promise(function(r){setTimeout(r,ms)})}

function say(who,text){
  return new Promise(function(done){
    sub.textContent="";
    who.classList.add("talk");
    function finish(){who.classList.remove("talk");done()}
    if(!window.speechSynthesis){setTimeout(finish,3500);return}
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text);
    u.lang="ta-IN";u.rate=.9;
    var vs=speechSynthesis.getVoices();
    for(var i=0;i<vs.length;i++){if(vs[i].lang&&vs[i].lang.indexOf("ta")===0){u.voice=vs[i];break}}
    var ended=false;
    u.onend=function(){if(!ended){ended=true;finish()}};
    u.onerror=function(){if(!ended){ended=true;setTimeout(finish,2500)}};
    speechSynthesis.speak(u);
    setTimeout(function(){if(!ended){ended=true;speechSynthesis.cancel();finish()}},12000);
  });
}

async function story(){
  stage.classList.add("play");
  ravi.classList.add("bounce");
  await say(ravi,"ஹாய்! நான் ரவி. இந்த சூரிய ஒளி என் வீட்டு ஜன்னல் வழியா வருதுனு பாருங்க.");
  await say(ravi,"இந்த ஒளி எப்படி பயணம் செய்யுது?");
  ravi.classList.remove("bounce");
  dog.style.left="52%";
  await wait(1800);
  dog.classList.add("bounce");
  await say(dog,"வுட் வுட்! ரவி, ஒளி எப்போம் நேர் கோட்டல தான் பயணம் செய்யும்.");
  await say(dog,"சூரியனல இருந்து கிளம்பி, எந்த தடையும் இல்லைனா நேரா வரும்.");
  stage.classList.add("showMirror");
  await say(ravi,"அடே! இந்த கன்னாடியில ஒளி புரண்டு வருது பாருங்க. அது பற்றி அடுத்த பாடத்தில பாக்கலாம்!");
  dog.classList.remove("bounce");
}

document.getElementById("start").onclick=function(){
  this.style.display="none";
  if(window.speechSynthesis){speechSynthesis.getVoices();var w=new SpeechSynthesisUtterance(" ");w.volume=0;speechSynthesis.speak(w)}
  story();
};
</script>
</body>
</html>
