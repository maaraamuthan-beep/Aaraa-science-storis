<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aaraa Science Stories</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif}
#stage{position:relative;width:100%;height:100%;overflow:hidden;background:#2a1d3a}
#wall{position:absolute;inset:0 0 28% 0;background:linear-gradient(#5b4a78,#7a6392 60%,#8f7aa6)}
#wall:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 2px,transparent 2px 60px)}
#floor{position:absolute;left:0;right:0;bottom:0;height:28%;background:linear-gradient(#8a5a33,#5e3a1c);box-shadow:inset 0 14px 22px rgba(0,0,0,.45)}
#floor:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(0,0,0,.18) 0 2px,transparent 2px 90px)}
#skirt{position:absolute;left:0;right:0;bottom:28%;height:14px;background:#3d2a18}
#winwrap{position:absolute;left:6%;top:12%;width:24%;height:46%}
#win{position:absolute;inset:0;border:10px solid #f2e6d0;background:linear-gradient(#ffd89a,#ffb86b 50%,#ff9a56);box-shadow:inset 0 0 60px rgba(255,240,180,.9),0 0 40px rgba(255,200,120,.6)}
#win:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:8px;margin-left:-4px;background:#f2e6d0}
#win:after{content:"";position:absolute;top:50%;left:0;right:0;height:8px;margin-top:-4px;background:#f2e6d0}
#mini-sun{position:absolute;right:18%;top:24%;width:54px;height:54px;border-radius:50%;background:radial-gradient(circle,#fff,#ffe9a0 50%,#ffb347);box-shadow:0 0 30px 14px rgba(255,220,120,.9)}
#curtainL,#curtainR{position:absolute;top:-8px;width:20%;height:calc(100% + 24px);background:linear-gradient(90deg,#c0392b,#e55a4a,#a93226);box-shadow:inset 0 0 12px rgba(0,0,0,.4)}
#curtainL{left:-26%;border-radius:0 0 40px 10px}
#curtainR{right:-26%;border-radius:0 0 10px 40px}
#sill{position:absolute;left:-6%;right:-6%;bottom:-18px;height:14px;background:#e6d7bd;box-shadow:0 6px 8px rgba(0,0,0,.4)}
#shaft{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;opacity:0;transition:opacity 2s;mix-blend-mode:screen}
#stage.beam #shaft{opacity:1}
#shaft svg{width:100%;height:100%}
#dust{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 2s}
#stage.beam #dust{opacity:1}
.mote{position:absolute;width:4px;height:4px;border-radius:50%;background:rgba(255,245,200,.9);box-shadow:0 0 6px 2px rgba(255,240,180,.7);animation:float 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(14px,-22px)}}
#bed{position:absolute;left:36%;bottom:16%;width:56%;height:34%}
#bedframe{position:absolute;left:0;right:0;bottom:0;height:46%;background:linear-gradient(#7a4a22,#4e2d12);border-radius:10px;box-shadow:0 10px 18px rgba(0,0,0,.5)}
#mattress{position:absolute;left:2%;right:2%;bottom:30%;height:34%;background:linear-gradient(#f4efe6,#d6cdbd);border-radius:14px}
#pillow{position:absolute;left:5%;bottom:56%;width:30%;height:30%;background:radial-gradient(ellipse at 40% 30%,#fff,#e4dccd);border-radius:50%;box-shadow:0 6px 10px rgba(0,0,0,.3)}
#blanket{position:absolute;left:30%;right:2%;bottom:36%;height:42%;background:linear-gradient(135deg,#3b82c4,#245a94);border-radius:18px 18px 8px 8px;box-shadow:0 8px 14px rgba(0,0,0,.4)}
#blanket:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(60deg,rgba(255,255,255,.08) 0 10px,transparent 10px 24px);border-radius:inherit}
#ravi{position:absolute;left:36.5%;bottom:36%;width:17%;height:34%;transform-origin:30% 100%;transition:transform 1.2s ease,bottom 1.2s ease,left 1.2s ease}
#ravi.up{transform:rotate(0deg);bottom:42%}
#ravi svg{width:100%;height:100%;overflow:visible}
#head{transition:transform 1.2s ease;transform-origin:60px 80px;transform:rotate(-82deg)}
#ravi.up #head{transform:rotate(0deg)}
#eyesOpen{opacity:0;transition:opacity .4s}
#eyesShut{opacity:1;transition:opacity .4s}
#ravi.awake #eyesOpen{opacity:1}
#ravi.awake #eyesShut{opacity:0}
#zzz{position:absolute;left:44%;bottom:60%;color:#fff;font-weight:bold;font-size:26px;opacity:.85;animation:zz 2.4s ease-in-out infinite}
@keyframes zz{0%{transform:translate(0,10px);opacity:0}30%{opacity:.9}100%{transform:translate(16px,-40px);opacity:0}}
.mouth{transform-origin:60px 96px}
.talk .mouth{animation:talk .2s steps(2) infinite}
@keyframes talk{50%{transform:scaleY(.25)}}
.arm{transform-origin:20px 120px}
.talk .arm{animation:wave .45s ease-in-out infinite alternate}
@keyframes wave{to{transform:rotate(-38deg)}}
#dog{position:absolute;left:-34%;bottom:10%;width:25%;height:24%;transition:left 2.2s ease-in-out;filter:drop-shadow(8px 6px 6px rgba(0,0,0,.5))}
#dog svg{width:100%;height:100%}
.tail{transform-origin:22px 50px;animation:wag .28s ease-in-out infinite alternate}
@keyframes wag{to{transform:rotate(38deg)}}
.dbounce{animation:hop .5s ease-in-out infinite}
@keyframes hop{50%{transform:translateY(-12px)}}
.blink{animation:blink 4s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
#night{position:absolute;inset:0;background:rgba(10,10,40,.55);transition:opacity 2.5s;pointer-events:none}
#stage.beam #night{opacity:.12}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#stage.flash #flash{animation:fl .6s ease-out}
@keyframes fl{0%{opacity:.9}100%{opacity:0}}
#start{position:absolute;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,15,45,.9);color:#fff;font-size:26px;cursor:pointer;text-align:center}
#start b{display:block;font-size:34px;margin-bottom:10px}
#go{margin-top:22px;background:linear-gradient(#ffb300,#ff7a00);border-radius:60px;padding:16px 46px;font-size:26px;box-shadow:0 6px 16px rgba(0,0,0,.5)}
#next{display:none;position:absolute;bottom:5%;right:4%;z-index:8;background:linear-gradient(#ffb300,#ff7a00);color:#fff;font-size:24px;padding:14px 38px;border-radius:60px;text-decoration:none;box-shadow:0 6px 16px rgba(0,0,0,.5)}
</style>
</head>
<body>
<div id="stage">
  <div id="wall"></div><div id="floor"></div><div id="skirt"></div>

  <div id="winwrap">
    <div id="win"><div id="mini-sun"></div></div>
    <div id="curtainL"></div><div id="curtainR"></div>
    <div id="sill"></div>
  </div>

  <div id="bed">
    <div id="bedframe"></div><div id="mattress"></div><div id="pillow"></div>
  </div>

  <div id="ravi">
    <svg viewBox="0 0 120 200">
      <defs>
        <radialGradient id="skin" cx=".4" cy=".35"><stop offset="0" stop-color="#f0b06a"/><stop offset="1" stop-color="#c2783a"/></radialGradient>
        <linearGradient id="pj" x1="0" x2="1"><stop offset="0" stop-color="#6ec6ff"/><stop offset="1" stop-color="#2b7bd1"/></linearGradient>
      </defs>
      <rect x="32" y="100" width="56" height="90" rx="16" fill="url(#pj)"/>
      <g class="arm"><rect x="12" y="106" width="16" height="52" rx="8" fill="url(#pj)"/><circle cx="20" cy="160" r="9" fill="url(#skin)"/></g>
      <rect x="92" y="106" width="16" height="52" rx="8" fill="url(#pj)"/><circle cx="100" cy="160" r="9" fill="url(#skin)"/>
      <g id="head">
        <rect x="52" y="88" width="16" height="16" fill="#c2783a"/>
        <ellipse cx="60" cy="58" rx="40" ry="42" fill="url(#skin)"/>
        <ellipse cx="22" cy="62" rx="7" ry="10" fill="#c2783a"/><ellipse cx="98" cy="62" rx="7" ry="10" fill="#c2783a"/>
        <path d="M19 55 Q20 6 60 8 Q100 6 101 55 Q94 28 78 24 Q64 38 44 28 Q26 34 19 55Z" fill="#1d120a"/>
        <g id="eyesShut"><path d="M34 62 Q44 70 54 62" stroke="#1d120a" stroke-width="3.5" fill="none"/><path d="M66 62 Q76 70 86 62" stroke="#1d120a" stroke-width="3.5" fill="none"/></g>
        <g id="eyesOpen" class="blink" style="transform-origin:60px 60px">
          <ellipse cx="44" cy="60" rx="9" ry="10" fill="#fff"/><ellipse cx="76" cy="60" rx="9" ry="10" fill="#fff"/>
          <circle cx="46" cy="61" r="5" fill="#3b2314"/><circle cx="78" cy="61" r="5" fill="#3b2314"/>
          <circle cx="48" cy="58" r="1.8" fill="#fff"/><circle cx="80" cy="58" r="1.8" fill="#fff"/>
        </g>
        <path d="M34 46 Q44 40 54 46" stroke="#1d120a" stroke-width="3" fill="none"/><path d="M66 46 Q76 40 86 46" stroke="#1d120a" stroke-width="3" fill="none"/>
        <path d="M58 66 Q60 74 63 70" stroke="#a85f2a" stroke-width="2.5" fill="none"/>
        <circle cx="34" cy="78" r="6" fill="rgba(255,120,100,.35)"/><circle cx="86" cy="78" r="6" fill="rgba(255,120,100,.35)"/>
        <g class="mouth"><path d="M46 86 Q60 104 74 86Z" fill="#7a1f1f"/><path d="M50 87 Q60 92 70 87 L70 89 Q60 94 50 89Z" fill="#fff"/></g>
      </g>
    </svg>
  </div>
  <div id="blanketTop" style="position:absolute;left:46%;right:8%;bottom:30%;height:19%;background:linear-gradient(135deg,#3b82c4,#245a94);border-radius:18px 18px 8px 8px;box-shadow:0 8px 14px rgba(0,0,0,.4)"></div>
  <div id="zzz">Z z z</div>

  <div id="shaft">
    <svg viewBox="0 0 100 100" preserveAspectRatio="none">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff6c0" stop-opacity=".95"/><stop offset="1" stop-color="#ffd77a" stop-opacity=".25"/></linearGradient></defs>
      <polygon points="8,14 30,14 62,48 40,66" fill="url(#lg)"/>
    </svg>
  </div>
  <div id="dust">
    <div class="mote" style="left:24%;top:28%"></div><div class="mote" style="left:32%;top:36%;animation-delay:-1s"></div>
    <div class="mote" style="left:40%;top:42%;animation-delay:-2s"></div><div class="mote" style="left:28%;top:44%;animation-delay:-3s"></div>
    <div class="mote" style="left:46%;top:36%;animation-delay:-4s"></div><div class="mote" style="left:36%;top:30%;animation-delay:-5s"></div>
  </div>

  <div id="dog">
    <svg viewBox="0 0 160 120">
      <defs><radialGradient id="fur" cx=".4" cy=".3"><stop offset="0" stop-color="#f0aa66"/><stop offset="1" stop-color="#b8662c"/></radialGradient></defs>
      <ellipse cx="72" cy="114" rx="60" ry="6" fill="rgba(0,0,0,.3)"/>
      <g class="tail"><path d="M22 50 Q0 24 10 8" stroke="#b8662c" stroke-width="11" fill="none" stroke-linecap="round"/></g>
      <ellipse cx="70" cy="66" rx="50" ry="30" fill="url(#fur)"/>
      <ellipse cx="72" cy="80" rx="30" ry="16" fill="#f6d3a8"/>
      <rect x="34" y="82" width="14" height="30" rx="7" fill="#a85a24"/><rect x="58" y="86" width="14" height="26" rx="7" fill="#b8662c"/>
      <rect x="84" y="86" width="14" height="26" rx="7" fill="#b8662c"/><rect x="98" y="82" width="14" height="30" rx="7" fill="#a85a24"/>
      <circle cx="118" cy="46" r="28" fill="url(#fur)"/>
      <ellipse cx="98" cy="34" rx="11" ry="22" fill="#7a3e14" transform="rotate(12 98 34)"/>
      <ellipse cx="134" cy="58" rx="16" ry="12" fill="#f6d3a8"/><ellipse cx="144" cy="53" rx="6" ry="5" fill="#222"/>
      <g class="blink" style="transform-origin:118px 40px"><circle cx="118" cy="40" r="6.5" fill="#fff"/><circle cx="119.5" cy="40.5" r="3.5" fill="#2a170a"/><circle cx="120.5" cy="39" r="1.2" fill="#fff"/></g>
      <path d="M108 30 Q116 26 124 31" stroke="#5a2d0c" stroke-width="2.5" fill="none"/>
      <g class="mouth" style="transform-origin:132px 66px"><path d="M124 64 Q134 78 144 64Z" fill="#c2185b"/><ellipse cx="134" cy="71" rx="5" ry="3" fill="#ff8a9b"/></g>
    </svg>
  </div>

  <div id="night"></div>
  <div id="flash"></div>
  <a id="next" href="page2.html">Next ➜</a>
  <div id="start"><b>Aaraa Science Stories</b>ஒளி (Light)<div id="go">▶ Start</div></div>
</div>

<audio id="r1" src="r1.mp3" preload="auto"></audio><audio id="d1" src="d1.mp3" preload="auto"></audio>
<audio id="r2" src="r2.mp3" preload="auto"></audio><audio id="d2" src="d2.mp3" preload="auto"></audio>
<audio id="r3" src="r3.mp3" preload="auto"></audio><audio id="d3" src="d3.mp3" preload="auto"></audio>
<audio id="r4" src="r4.mp3" preload="auto"></audio><audio id="d4" src="d4.mp3" preload="auto"></audio>
<audio id="r5" src="r5.mp3" preload="auto"></audio>

<script>
var stage=document.getElementById("stage"),raviBox=document.getElementById("ravi"),dogBox=document.getElementById("dog"),zzz=document.getElementById("zzz");
function wait(ms){return new Promise(function(r){setTimeout(r,ms)})}
function play(id,who){
  return new Promise(function(done){
    var a=document.getElementById(id);
    who.classList.add("talk");
    function finish(){who.classList.remove("talk");done()}
    a.currentTime=0;a.onended=finish;a.onerror=function(){setTimeout(finish,2000)};
    var p=a.play();if(p&&p.catch){p.catch(function(){setTimeout(finish,2000)})}
  });
}
async function story(){
  await wait(2500);
  stage.classList.add("beam");
  await wait(2500);
  stage.classList.add("flash");
  zzz.style.display="none";
  raviBox.classList.add("awake");
  await wait(500);
  raviBox.classList.add("up");
  await wait(900);
  await play("r1",raviBox);
  dogBox.style.left="8%";
  await wait(2400);
  dogBox.classList.add("dbounce");
  await play("d1",dogBox);
  await play("r2",raviBox);
  await play("d2",dogBox);
  await play("r3",raviBox);
  await play("d3",dogBox);
  await play("r4",raviBox);
  await play("d4",dogBox);
  await play("r5",raviBox);
  dogBox.classList.remove("dbounce");
  document.getElementById("next").style.display="block";
}
document.getElementById("start").onclick=function(){this.style.display="none";story()};
</script>
</body>
</html>
