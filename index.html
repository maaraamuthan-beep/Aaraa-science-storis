<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aaraa Science Stories</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif}
#stage{position:relative;width:100%;height:100%;overflow:hidden;background:linear-gradient(#ff7e5f 0%,#feb47b 25%,#ffd89b 45%,#bfe6ff 70%)}
#sun{position:absolute;left:4%;bottom:34%;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,#fffde0 0%,#ffe066 40%,#ff9800 100%);box-shadow:0 0 80px 40px rgba(255,200,0,.75);animation:rise 6s ease-out forwards,pulse 3s ease-in-out infinite}
@keyframes rise{from{transform:translateY(120px)}to{transform:translateY(0)}}
@keyframes pulse{50%{box-shadow:0 0 120px 60px rgba(255,200,0,.85)}}
.ray{position:absolute;left:calc(4% + 65px);bottom:calc(34% + 65px);height:14px;width:0;border-radius:14px;background:linear-gradient(90deg,rgba(255,244,170,.95),rgba(255,244,170,0));transform-origin:left center;filter:blur(2px)}
#stage.play .ray{animation:shine 3s ease-out forwards}
.r1{transform:rotate(-8deg)}.r2{transform:rotate(2deg);animation-delay:.4s!important}.r3{transform:rotate(12deg);animation-delay:.8s!important}.r4{transform:rotate(22deg);animation-delay:1.2s!important}
@keyframes shine{to{width:62%}}
.cloud{position:absolute;background:#fff;border-radius:50px;opacity:.85;animation:drift linear infinite}
.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}
.c1{top:10%;left:-20%;width:130px;height:40px;animation-duration:50s}
.c1:before{width:55px;height:55px;top:-28px;left:15px}.c1:after{width:65px;height:65px;top:-32px;left:60px}
.c2{top:22%;left:-30%;width:100px;height:32px;animation-duration:70s;animation-delay:-25s}
.c2:before{width:42px;height:42px;top:-20px;left:10px}.c2:after{width:48px;height:48px;top:-24px;left:44px}
@keyframes drift{to{transform:translateX(150vw)}}
#hills{position:absolute;bottom:22%;left:0;width:100%;height:20%;background:radial-gradient(ellipse at 30% 100%,#4c9a4c 60%,transparent 61%),radial-gradient(ellipse at 75% 100%,#3d8a3d 60%,transparent 61%)}
#ground{position:absolute;bottom:0;left:0;width:100%;height:24%;background:linear-gradient(#5cbf5c,#2f8a2f)}
#house{position:absolute;bottom:20%;right:6%;width:160px;height:125px;background:#ffcc80;border:3px solid #c68a3c}
#house:before{content:"";position:absolute;top:-58px;left:-18px;border-left:101px solid transparent;border-right:101px solid transparent;border-bottom:58px solid #d84315}
#house .win{position:absolute;top:32px;left:50px;width:55px;height:48px;background:linear-gradient(135deg,#fff7c2,#ffe082);border:4px solid #8d5524;box-shadow:0 0 25px 10px rgba(255,230,120,.8)}
.char{position:absolute;bottom:13%;transition:left 1.6s ease-in-out}
#ravi{left:38%;width:120px;height:215px}
#dog{left:-30%;width:165px;height:120px}
.bounce{animation:hop .5s ease-in-out infinite}
@keyframes hop{50%{transform:translateY(-14px)}}
.talk .mouth{animation:talk .22s steps(2) infinite}
@keyframes talk{50%{transform:scaleY(.25)}}
.talk .arm{animation:wave .5s ease-in-out infinite alternate}
.arm{transform-origin:25px 105px}
@keyframes wave{to{transform:rotate(-35deg)}}
.tail{transform-origin:20px 45px;animation:wag .3s ease-in-out infinite alternate}
@keyframes wag{to{transform:rotate(35deg)}}
#face-glow{position:absolute;left:38%;bottom:40%;width:120px;height:90px;border-radius:50%;background:radial-gradient(circle,rgba(255,240,160,.0),rgba(255,240,160,0));transition:background 2s;pointer-events:none}
#stage.play #face-glow{background:radial-gradient(circle,rgba(255,240,160,.75),rgba(255,240,160,0) 70%)}
#start{position:absolute;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,30,70,.85);color:#fff;font-size:26px;cursor:pointer;text-align:center}
#start b{display:block;font-size:34px;margin-bottom:10px}
#go{margin-top:22px;background:#ff9800;border-radius:60px;padding:16px 44px;font-size:26px;box-shadow:0 6px 16px rgba(0,0,0,.4)}
</style>
</head>
<body>
<div id="stage">
  <div id="sun"></div>
  <div class="ray r1"></div><div class="ray r2"></div><div class="ray r3"></div><div class="ray r4"></div>
  <div class="cloud c1"></div><div class="cloud c2"></div>
  <div id="hills"></div>
  <div id="house"><div class="win"></div></div>
  <div id="ground"></div>
  <div id="face-glow"></div>

  <svg id="ravi" class="char" viewBox="0 0 110 200">
    <rect x="30" y="95" width="50" height="60" rx="10" fill="#ef5350"/>
    <rect x="32" y="150" width="18" height="45" fill="#3f51b5"/><rect x="58" y="150" width="18" height="45" fill="#3f51b5"/>
    <g class="arm"><rect x="14" y="100" width="14" height="45" rx="7" fill="#c68642"/></g>
    <rect x="80" y="100" width="14" height="45" rx="7" fill="#c68642"/>
    <circle cx="55" cy="58" r="38" fill="#d9964f"/>
    <path d="M17 52 Q55 -8 93 52 Q80 25 55 28 Q30 25 17 52Z" fill="#2b1b10"/>
    <circle cx="42" cy="58" r="7" fill="#fff"/><circle cx="68" cy="58" r="7" fill="#fff"/>
    <circle cx="43" cy="59" r="3.5" fill="#222"/><circle cx="69" cy="59" r="3.5" fill="#222"/>
    <g class="mouth" style="transform-origin:55px 78px"><ellipse cx="55" cy="78" rx="10" ry="7" fill="#7a1f1f"/></g>
  </svg>

  <svg id="dog" class="char" viewBox="0 0 150 110">
    <g class="tail"><path d="M20 45 Q0 20 10 8" stroke="#a0522d" stroke-width="10" fill="none" stroke-linecap="round"/></g>
    <ellipse cx="65" cy="60" rx="45" ry="28" fill="#d2884a"/>
    <rect x="30" y="75" width="12" height="30" rx="6" fill="#b5713a"/><rect x="80" y="75" width="12" height="30" rx="6" fill="#b5713a"/>
    <circle cx="112" cy="42" r="26" fill="#d2884a"/>
    <ellipse cx="95" cy="30" rx="10" ry="20" fill="#8b4d1f"/>
    <ellipse cx="128" cy="52" rx="14" ry="10" fill="#f1c8a0"/><circle cx="137" cy="48" r="5" fill="#222"/>
    <circle cx="112" cy="36" r="5" fill="#fff"/><circle cx="113" cy="36" r="2.5" fill="#222"/>
    <g class="mouth" style="transform-origin:126px 60px"><path d="M118 58 Q127 68 136 58Z" fill="#c2185b"/></g>
  </svg>

  <div id="start"><b>Aaraa Science Stories</b>ஒளி (Light)<div id="go">▶ Start</div></div>
</div>

<audio id="aRavi" src="ravi.mp3" preload="auto"></audio>
<audio id="aDog" src="dog.mp3" preload="auto"></audio>

<script>
var stage=document.getElementById("stage"),ravi=document.getElementById("ravi"),dog=document.getElementById("dog");
var aRavi=document.getElementById("aRavi"),aDog=document.getElementById("aDog");

function wait(ms){return new Promise(function(r){setTimeout(r,ms)})}

function play(audio,who){
  return new Promise(function(done){
    who.classList.add("talk");
    function finish(){who.classList.remove("talk");done()}
    audio.currentTime=0;
    audio.onended=finish;
    audio.onerror=function(){setTimeout(finish,2000)};
    var p=audio.play();
    if(p&&p.catch){p.catch(function(){setTimeout(finish,2000)})}
  });
}

async function story(){
  stage.classList.add("play");
  ravi.classList.add("bounce");
  await wait(2500);
  await play(aRavi,ravi);
  ravi.classList.remove("bounce");
  dog.style.left="60%";
  await wait(1800);
  dog.classList.add("bounce");
  await play(aDog,dog);
  dog.classList.remove("bounce");
}

document.getElementById("start").onclick=function(){
  this.style.display="none";
  story();
};
</script>
</body>
</html>
